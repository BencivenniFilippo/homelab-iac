apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-ingress
  namespace: nextcloud
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Nextcloud requires larger body limits for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
spec:
  rules:
  - host: nextcloud.filippo-homelab.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextcloud
            port:
              number: 80
  tls:
  - hosts:
    - nextcloud.filippo-homelab.dev
    secretName: nextcloud-tls
